spring.application.name=user
server.port=0

#DB LOCAL CONFIGURATION spring.datasource.url=jdbc:mysql://mysql-user-db:3306/userdb spring.datasource.username=useradmin spring.datasource.password=userpassword spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#H2 CONFIGURATION FOR TESTING
spring.datasource.url=jdbc:h2:mem:usertest
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=useradmin
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

#to open h2 console http://localhost:8060/h2-console

#Registring user with Eureka as a client

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.fetch-registry=true
spring.cloud.config.enabled=false
management.endpoints.web.exposure.include=*